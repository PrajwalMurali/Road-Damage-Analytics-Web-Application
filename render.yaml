services:
  - type: web
    name: road-damage-analytics
    env: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn lab3project.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_SETTINGS_MODULE
        value: lab3project.settings
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
