{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="card">
    <h2>Set a New Password</h2>

    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                {{ form.as_p }}
            </div>
        </div>
        <button type="submit" class="button">Reset Password</button>
    </form>
</section>
{% endblock %}
