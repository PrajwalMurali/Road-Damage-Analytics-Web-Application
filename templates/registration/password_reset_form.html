{% extends 'base.html' %}

{% block title %}Password Reset{% endblock %}

{% block content %}
<section class="card">
    <h2>Forgot Password</h2>
    <p>Enter your email address and we will send password reset instructions.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            <div>
                <label for="id_email">Email Address</label><br>
                {{ form.email }}
                {% if form.email.errors %}
                    <div style="color: #b91c1c;">{{ form.email.errors }}</div>
                {% endif %}
            </div>
        </div>
        <button type="submit" class="button">Send Reset Instructions</button>
    </form>
</section>
{% endblock %}
